<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aiden 記帳</title>
<style>
:root {
  --bg:     #0f0f1a;
  --s1:     #16162a;
  --s2:     #1e1e35;
  --s3:     #262640;
  --border: #2e2e50;
  --text:   #e8e8f0;
  --t2:     #a0a0c0;
  --t3:     #606080;
  --accent: #7c6af7;
  --green:  #4ecb8d;
  --red:    #e85a7a;
  --yellow: #f7c86a;
  --blue:   #5ab4f7;
  --orange: #f7a05a;
  --r:      12px;
  --r-sm:   8px;
  --r-xs:   6px;
  --font:   -apple-system, BlinkMacSystemFont, 'Arial', sans-serif;
  --mono:   'SF Mono', 'Consolas', monospace;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--font); }

/* NAV */
nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  background: var(--s1); border-bottom: 1px solid var(--border);
  padding: 0 16px;
  display: flex; align-items: center; gap: 12px;
  height: 52px;
}
.nav-brand { font-weight: 700; font-size: 13px; color: var(--accent); letter-spacing: .06em; white-space: nowrap; }
.nav-tabs { display: flex; gap: 2px; flex: 1; overflow-x: auto; scrollbar-width: none; }
.nav-tabs::-webkit-scrollbar { display: none; }
.nav-tab {
  background: none; border: none; color: var(--t3); cursor: pointer;
  padding: 6px 10px; border-radius: var(--r-xs); font-family: var(--font);
  font-size: 12px; white-space: nowrap; transition: all .15s;
}
.nav-tab:hover { color: var(--t2); background: var(--s2); }
.nav-tab.active { color: var(--text); background: var(--accent); font-weight: 600; }
.sync-status { font-size: 11px; color: var(--t3); white-space: nowrap; }
.sync-status.ok { color: var(--green); }
.sync-status.warn { color: var(--yellow); }
.sync-status.err { color: var(--red); }

/* PAGES */
.page { display: none; padding: 68px 16px 80px; max-width: 900px; margin: 0 auto; }
.page.active { display: block; }

/* CARDS */
.card { background: var(--s1); border: 1px solid var(--border); border-radius: var(--r); padding: 16px; margin-bottom: 12px; }
.card-title { font-size: 12px; color: var(--t3); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 8px; }

/* SUMMARY GRID */
.summary-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 16px; }
.sum-card {
  background: var(--s1); border: 1px solid var(--border); border-radius: var(--r);
  padding: 14px; position: relative; overflow: hidden;
}
.sum-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; }
.sum-card.tw::before { background: var(--accent); }
.sum-card.au::before { background: var(--blue); }
.sum-card.red::before { background: var(--red); }
.sum-card.green::before { background: var(--green); }
.sum-label { font-size: 10px; color: var(--t3); margin-bottom: 6px; }
.sum-val { font-size: 20px; font-weight: 700; font-family: var(--mono); }
.sum-val.tw { color: var(--accent); }
.sum-val.au { color: var(--blue); }
.sum-val.neg { color: var(--red); }
.sum-val.pos { color: var(--green); }
.sum-currency { font-size: 10px; color: var(--t3); margin-top: 2px; }

/* SECTION HEADER */
.sh { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.sh-title { font-size: 14px; font-weight: 600; }

/* TABLE */
.tbl { width: 100%; border-collapse: collapse; }
.tbl th { font-size: 10px; color: var(--t3); text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--border); }
.tbl td { font-size: 13px; padding: 10px; border-bottom: 1px solid var(--border); }
.tbl tr:last-child td { border-bottom: none; }
.tbl tr:hover td { background: rgba(255,255,255,.02); }

/* TX LIST */
.tx-row {
  display: grid;
  grid-template-columns: 70px auto 1fr auto auto auto;
  gap: 8px; align-items: center;
  padding: 10px 14px; border-bottom: 1px solid var(--border);
}
.tx-row:last-child { border-bottom: none; }
.tx-date { font-size: 11px; color: var(--t3); font-family: var(--mono); }
.tx-badge {
  font-size: 10px; padding: 2px 7px; border-radius: 20px;
  font-weight: 600; white-space: nowrap;
}
.b-飲食,.b-食物 { background: rgba(76,203,141,.15); color: var(--green); }
.b-交通 { background: rgba(90,180,247,.15); color: var(--blue); }
.b-購物,.b-服飾 { background: rgba(124,106,247,.15); color: var(--accent); }
.b-娛樂 { background: rgba(247,160,90,.15); color: var(--orange); }
.b-醫療 { background: rgba(232,90,122,.15); color: var(--red); }
.b-居住,.b-房租 { background: rgba(247,200,106,.15); color: var(--yellow); }
.b-雜支,.b-其他 { background: rgba(96,96,128,.15); color: var(--t2); }
.b-收入,.b-薪資,.b-業績,.b-業績獎金,.b-退款,.b-代墊回收,.b-其他收入 { background: rgba(76,203,141,.2); color: var(--green); }
.b-代墊款 { background: rgba(247,200,106,.15); color: var(--yellow); }
.b-代墊回款 { background: rgba(76,203,141,.15); color: var(--green); }
.b-內部轉帳 { background: rgba(124,106,247,.1); color: var(--accent); }
.b-信用卡費 { background: rgba(232,90,122,.15); color: var(--red); }
.b-不計統計 { background: rgba(96,96,128,.1); color: var(--t3); }
.b-押金 { background: rgba(247,160,90,.15); color: var(--orange); }
.tx-desc { min-width: 0; }
.tx-desc-main { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tx-desc-sub { font-size: 11px; color: var(--t3); margin-top: 2px; }
.tx-amt { font-size: 14px; font-weight: 600; font-family: var(--mono); white-space: nowrap; text-align: right; }
.tx-amt.out { color: var(--red); }
.tx-amt.in { color: var(--green); }
.tx-amt.neutral { color: var(--t2); }
.tx-curr { font-size: 10px; color: var(--t3); text-align: right; }
.tx-del { background: none; border: none; color: var(--t3); cursor: pointer; font-size: 18px; padding: 0 4px; line-height: 1; }
.tx-del:hover { color: var(--red); }

/* FORMS */
.fg { display: flex; flex-direction: column; gap: 5px; }
.fl { font-size: 11px; color: var(--t3); }
input, select, textarea {
  background: var(--s2); border: 1px solid var(--border); color: var(--text);
  padding: 9px 11px; border-radius: var(--r-xs); font-family: var(--font); font-size: 13px;
  width: 100%; outline: none; transition: border-color .15s;
}
input:focus, select:focus, textarea:focus { border-color: var(--accent); }
input[type=number]::-webkit-inner-spin-button { opacity: .5; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.form-grid .full { grid-column: 1 / -1; }
.text-muted { font-size: 11px; color: var(--t3); margin-top: 4px; }

/* BUTTONS */
.btn { padding: 9px 16px; border-radius: var(--r-xs); border: none; cursor: pointer; font-family: var(--font); font-size: 13px; font-weight: 600; transition: opacity .15s; }
.btn:hover { opacity: .85; }
.btn-primary { background: var(--accent); color: #fff; }
.btn-ghost { background: var(--s2); color: var(--t2); border: 1px solid var(--border); }
.btn-danger { background: rgba(232,90,122,.15); color: var(--red); border: 1px solid rgba(232,90,122,.3); }

/* FAB */
.fab {
  position: fixed; bottom: 24px; right: 20px; z-index: 90;
  width: 52px; height: 52px; border-radius: 50%;
  background: var(--accent); border: none; color: #fff;
  font-size: 24px; cursor: pointer; box-shadow: 0 4px 20px rgba(124,106,247,.4);
  display: flex; align-items: center; justify-content: center;
  transition: transform .15s, box-shadow .15s;
}
.fab:hover { transform: scale(1.08); box-shadow: 0 6px 24px rgba(124,106,247,.5); }

/* MODAL */
.modal-overlay {
  display: none; position: fixed; inset: 0; z-index: 200;
  background: rgba(0,0,0,.6); backdrop-filter: blur(4px);
  align-items: flex-end; justify-content: center;
}
.modal-overlay.open { display: flex; }
.modal {
  background: var(--s1); border: 1px solid var(--border);
  border-radius: var(--r) var(--r) 0 0;
  width: 100%; max-width: 560px; max-height: 92vh;
  overflow-y: auto; padding: 20px 18px 32px;
}
@media(min-width:600px){
  .modal-overlay { align-items: center; }
  .modal { border-radius: var(--r); max-height: 88vh; }
}
.modal-title { font-size: 16px; font-weight: 700; margin-bottom: 16px; }
.modal-footer { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; }
.divider { height: 1px; background: var(--border); margin: 14px 0; }

/* CURRENCY TAB */
.curr-tabs { display: flex; gap: 6px; margin-bottom: 14px; }
.curr-tab { flex: 1; padding: 7px; border-radius: var(--r-xs); border: 1px solid var(--border); background: var(--s2); color: var(--t2); cursor: pointer; font-size: 12px; font-weight: 600; text-align: center; }
.curr-tab.active-tw { background: rgba(124,106,247,.2); border-color: var(--accent); color: var(--accent); }
.curr-tab.active-au { background: rgba(90,180,247,.2); border-color: var(--blue); color: var(--blue); }

/* FILTER BAR */
.filter-bar { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
.filter-bar select, .filter-bar input { width: auto; flex: 1; min-width: 100px; font-size: 12px; padding: 7px 9px; }

/* ADVANCE CARD */
.adv-card { background: var(--s2); border-radius: var(--r-sm); padding: 12px; margin-bottom: 8px; }
.adv-meta { font-size: 11px; color: var(--t3); margin-top: 4px; }
.badge-settled { background: rgba(76,203,141,.15); color: var(--green); font-size: 10px; padding: 2px 7px; border-radius: 20px; }
.badge-pending { background: rgba(247,200,106,.15); color: var(--yellow); font-size: 10px; padding: 2px 7px; border-radius: 20px; }
.badge-deposit { background: rgba(247,160,90,.15); color: var(--orange); font-size: 10px; padding: 2px 7px; border-radius: 20px; }

/* SETTINGS */
.setting-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
.setting-tag { background: var(--s2); border: 1px solid var(--border); border-radius: var(--r-xs); padding: 6px 10px; font-size: 12px; flex: 1; }
.setting-del { background: none; border: none; color: var(--t3); cursor: pointer; font-size: 16px; }
.setting-del:hover { color: var(--red); }

/* MOBILE */
@media(max-width:600px){
  .form-grid { grid-template-columns: 1fr; }
  .form-grid .full { grid-column: 1; }
  .tx-row { grid-template-columns: 60px auto 1fr auto auto; }
  .tx-curr { display: none; }
  .summary-grid { grid-template-columns: 1fr 1fr; }
  nav { padding: 0 10px; }
  .nav-tab { padding: 5px 7px; font-size: 11px; }
}

.mt8 { margin-top: 8px; }
.mt12 { margin-top: 12px; }

/* CHART TABS */
#cht-tab-trend, #cht-tab-pie { transition: color .15s, border-color .15s; }
#cht-tab-trend:hover, #cht-tab-pie:hover { color: var(--t2); }
@media(max-width:600px){
  #cht-pane-pie > div:last-child { grid-template-columns: 1fr; }
}
.section-hdr { font-size: 13px; font-weight: 700; color: var(--t2); margin: 14px 0 8px; display: flex; align-items: center; gap: 6px; }
.empty { text-align: center; color: var(--t3); font-size: 13px; padding: 32px 0; }
</style>
</head>
<body>

<nav>
  <div class="nav-brand">⬡ v.Pro7</div>
  <div class="nav-tabs">
    <button class="nav-tab active" onclick="showPage('overview')">總覽</button>
    <button class="nav-tab" onclick="showPage('ledger')">明細</button>
    <button class="nav-tab" onclick="showPage('charts')">圖表</button>
    <button class="nav-tab" onclick="showPage('advance')">代墊/押金</button>
    <button class="nav-tab" onclick="showPage('settings')">設定</button>
  </div>
  <span id="sync-status" class="sync-status">載入中...</span>
</nav>

<!-- ══ 總覽 ══ -->
<div id="page-overview" class="page active">
  <div id="ov-content"></div>
</div>

<!-- ══ 明細 ══ -->
<div id="page-ledger" class="page">
  <div class="filter-bar">
    <select id="lf-month" onchange="renderLedger()"><option value="">全部月份</option></select>
    <select id="lf-cat" onchange="renderLedger()"><option value="">全部類別</option></select>
    <select id="lf-acct" onchange="renderLedger()"><option value="">全部帳戶</option></select>
    <select id="lf-curr" onchange="renderLedger()">
      <option value="">全部幣別</option>
      <option value="TWD">台幣</option>
      <option value="AUD">澳幣</option>
    </select>
  </div>
  <div class="card" style="padding:0;">
    <div id="tx-list"></div>
  </div>
</div>

<!-- ══ 圖表 ══ -->
<div id="page-charts" class="page">
  <!-- 幣別 + chart tab 切換 -->
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px;">
    <div class="curr-tabs" style="margin:0;flex:0 0 auto;">
      <button class="curr-tab active-tw" id="ct-twd" onclick="setChartCurr('TWD')">台幣 TWD</button>
      <button class="curr-tab" id="ct-aud" onclick="setChartCurr('AUD')">澳幣 AUD</button>
    </div>
  </div>
  <div style="display:flex;gap:2px;margin-bottom:14px;border-bottom:1px solid var(--border);padding-bottom:0;">
    <button id="cht-tab-trend" onclick="setChartTab('trend')"
      style="background:none;border:none;cursor:pointer;padding:8px 14px;font-size:13px;font-weight:600;border-bottom:2px solid var(--accent);color:var(--text);font-family:var(--font);">收支趨勢</button>
    <button id="cht-tab-pie" onclick="setChartTab('pie')"
      style="background:none;border:none;cursor:pointer;padding:8px 14px;font-size:13px;color:var(--t3);border-bottom:2px solid transparent;font-family:var(--font);">分類占比</button>
  </div>

  <!-- Tab 1: 收支趨勢 -->
  <div id="cht-pane-trend">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
      <div id="chart-summary-row" style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;flex:1;margin-right:10px;"></div>
      <button id="cht-range-btn" onclick="toggleChartRange()"
        style="background:var(--s2);border:1px solid var(--border);color:var(--t2);padding:6px 12px;border-radius:var(--r-xs);cursor:pointer;font-size:12px;font-family:var(--font);white-space:nowrap;">近6月</button>
    </div>
    <div class="card">
      <div class="card-title">月收支對比</div>
      <canvas id="chart-monthly" height="200"></canvas>
    </div>
    <div class="card mt12">
      <div class="card-title">月淨額走勢</div>
      <canvas id="chart-net" height="160"></canvas>
    </div>
  </div>

  <!-- Tab 2: 分類占比 -->
  <div id="cht-pane-pie" style="display:none;">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;">
      <label style="font-size:12px;color:var(--t3);">月份</label>
      <select id="cf-pie-month" onchange="renderPieCharts()" style="width:auto;font-size:12px;padding:6px 10px;"></select>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
      <div class="card" style="margin:0;">
        <div class="card-title">支出占比</div>
        <canvas id="chart-cat-exp" height="200"></canvas>
        <div id="chart-cat-exp-empty" class="empty" style="display:none;padding:20px 0;">無支出記錄</div>
      </div>
      <div class="card" style="margin:0;">
        <div class="card-title">收入占比</div>
        <canvas id="chart-cat-inc" height="200"></canvas>
        <div id="chart-cat-inc-empty" class="empty" style="display:none;padding:20px 0;">無收入記錄</div>
      </div>
    </div>
  </div>
</div>

<!-- ══ 代墊/押金 ══ -->
<div id="page-advance" class="page">
  <div class="sh"><div class="sh-title">待回款</div><div id="adv-pending-total" style="font-family:var(--mono);color:var(--yellow);font-size:13px;"></div></div>
  <div id="adv-pending"></div>
  <div class="section-hdr" style="margin-top:20px;">押金追蹤</div>
  <div id="deposit-list"></div>
  <div class="section-hdr" style="margin-top:20px;color:var(--t3);">已結清</div>
  <div id="adv-settled"></div>
</div>

<!-- ══ 設定 ══ -->
<div id="page-settings" class="page">
  <div class="card">
    <div class="card-title">台幣銀行帳戶</div>
    <div id="set-tw-banks"></div>
    <div style="display:flex;gap:8px;margin-top:8px;">
      <input id="new-tw-bank" placeholder="新增帳戶名稱" style="flex:1;">
      <button class="btn btn-ghost" onclick="addTWBank()">新增</button>
    </div>
  </div>
  <div class="card">
    <div class="card-title">信用卡</div>
    <div id="set-ccs"></div>
    <div style="display:flex;gap:8px;margin-top:8px;">
      <input id="new-cc" placeholder="新增信用卡名稱" style="flex:1;">
      <button class="btn btn-ghost" onclick="addCC()">新增</button>
    </div>
  </div>
  <div class="card">
    <div class="card-title">澳幣銀行帳戶</div>
    <div id="set-au-banks"></div>
    <div style="display:flex;gap:8px;margin-top:8px;">
      <input id="new-au-bank" placeholder="新增帳戶名稱" style="flex:1;">
      <button class="btn btn-ghost" onclick="addAUBank()">新增</button>
    </div>
  </div>
  <div class="card">
    <div class="card-title">支出類別</div>
    <div id="set-cats"></div>
    <div style="display:flex;gap:8px;margin-top:8px;">
      <input id="new-cat" placeholder="新增類別" style="flex:1;">
      <button class="btn btn-ghost" onclick="addCat()">新增</button>
    </div>
  </div>
  <div class="card">
    <div class="card-title">期初餘額（台幣）</div>
    <div id="set-tw-init"></div>
    <div class="card-title mt12">期初餘額（澳幣）</div>
    <div id="set-au-init"></div>
    <div class="card-title mt12">信用卡期初未繳</div>
    <div id="set-cc-init"></div>
    <button class="btn btn-primary mt12" onclick="saveInitBalances()" style="width:100%;">確認更新期初餘額</button>
  </div>
  <div class="card">
    <div class="card-title" style="color:var(--red);">⚠️ 危險操作</div>
    <button class="btn btn-danger" style="width:100%;" onclick="clearAllData()">清除所有資料重新開始</button>
  </div>
</div>

<!-- ══ 新增記帳 Modal ══ -->
<div class="modal-overlay" id="modal-tx">
<div class="modal">
  <div class="modal-title">新增記帳</div>
  <div class="form-grid">
    <div class="fg">
      <label class="fl">日期</label>
      <input type="date" id="tx-date">
    </div>
    <div class="fg">
      <label class="fl">幣別</label>
      <select id="tx-curr" onchange="onTxCurrChange()">
        <option value="TWD">台幣 TWD</option>
        <option value="AUD">澳幣 AUD</option>
      </select>
    </div>
    <div class="fg full">
      <label class="fl">支付方式</label>
      <select id="tx-pay" onchange="onTxPayChange()"></select>
    </div>
    <div class="fg full" id="tx-amt-grp">
      <label class="fl">金額</label>
      <input type="number" id="tx-amt" placeholder="0" min="0" oninput="onTxAmtChange()">
    </div>
    <div class="fg full" id="tx-stat-grp">
      <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;color:var(--t2);">
        <input type="checkbox" id="tx-stat" checked onchange="onTxStatChange()" style="accent-color:var(--accent);width:16px;height:16px;flex-shrink:0;">
        <span>計入支出統計</span>
      </label>
    </div>
    <div class="fg" id="tx-cat-grp">
      <label class="fl">類別</label>
      <select id="tx-cat"></select>
    </div>
    <div class="fg full" id="tx-item-grp">
      <label class="fl">說明</label>
      <input type="text" id="tx-item" placeholder="例：便當、Uber">
    </div>
    <div class="fg full">
      <label class="fl">備註</label>
      <input type="text" id="tx-note" placeholder="選填">
    </div>
  </div>

  <!-- 內部轉帳 -->
  <div id="tx-int-area" style="display:none;">
    <div class="divider"></div>
    <div class="form-grid">
      <div class="fg"><label class="fl">從</label><select id="tx-int-from"></select></div>
      <div class="fg"><label class="fl">轉入</label><select id="tx-int-to"></select></div>
      <div class="fg full"><label class="fl">金額</label><input type="number" id="tx-int-amt" placeholder="0"></div>
    </div>
    <div class="text-muted">不計入收支統計</div>
  </div>

  <!-- 繳信用卡費 -->
  <div id="tx-cc-area" style="display:none;">
    <div class="divider"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script>
// ════════════════════════════════════════
// CLOUD CONFIG
// ════════════════════════════════════════
const CLOUD_URL = 'https://script.google.com/macros/s/AKfycbzGOqXaiM44kq_ow6yFMQIs3cPbS955I0JLoZVh2ZV4rrj9n0RG0yQ_V4NCQ1Cd8_wz/exec';

// ════════════════════════════════════════
// DEFAULT DATA
// ════════════════════════════════════════
const DEFAULT = {
  settings: {
    twBanks: ['玉山銀行','國泰銀行','中信銀行','台新銀行','台企銀行','土地銀行'],
    auBanks: ['ANZ帳戶','Commonwealth帳戶'],
    creditCards: ['華航鼎尊卡','台新Richart卡','國泰Cube卡','玉山Pi卡'],
    categories: ['飲食','交通','購物','娛樂','醫療','居住','雜支'],
    initTWBanks: {},
    initAUBanks: {},
    initTWCash: 0,
    initAUCash: 0,
    initCC: {},
  },
  transactions: [],
  advances: [],
  deposits: [],
};

let DB = JSON.parse(JSON.stringify(DEFAULT));
let _repayId = null;
let _depositRepayId = null;
let _saving = false;
let _charts = {};

// ════════════════════════════════════════
// STORAGE
// ════════════════════════════════════════
async function loadFromCloud(){
  showSyncStatus('載入中...','');
  try {
    const r = await fetch(CLOUD_URL + '?method=load', {cache:'no-store'});
    if(!r.ok) throw new Error('HTTP ' + r.status);
    const text = await r.text();
    let data;
    try { data = JSON.parse(text); } catch(pe){ throw new Error('解析失敗'); }

    if(data && data.settings){
      // 雲端有完整資料
      DB = data;
      localStorage.setItem('acct_pro', text);
      showSyncStatus('已同步 ✓','ok');
    } else {
      // 雲端是空的（新帳號或 A1 為空）——用本地資料，並上傳本地至雲端
      const local = localStorage.getItem('acct_pro');
      if(local){ try{ DB = JSON.parse(local); }catch{} }
      showSyncStatus('已同步 ✓','ok');
      // 把本地資料推上雲端（讓雲端不再是空的）
      save();
    }
  } catch(e) {
    // 真正的網路錯誤或離線
    const local = localStorage.getItem('acct_pro');
    if(local){
      try{ DB = JSON.parse(local); showSyncStatus('離線模式（本地）','warn'); }
      catch{ showSyncStatus('載入失敗','err'); }
    } else {
      showSyncStatus('離線模式','warn');
    }
  }
  renderAll();
}

async function save(){
  const json = JSON.stringify(DB);
  localStorage.setItem('acct_pro', json);
  if(_saving) return;
  _saving = true;
  try {
    const url = CLOUD_URL + '?method=save&data=' + encodeURIComponent(json);
    const r = await fetch(url, {cache:'no-store'});
    if(!r.ok) throw new Error('HTTP ' + r.status);
    showSyncStatus('已同步 ✓','ok');
  } catch(e) {
    showSyncStatus('本地已儲存','warn');
  }
  _saving = false;
}

function showSyncStatus(msg, cls){
  const el = document.getElementById('sync-status');
  el.textContent = msg;
  el.className = 'sync-status' + (cls ? ' ' + cls : '');
}

// ════════════════════════════════════════
// COMPUTE
// ════════════════════════════════════════
function computeAll(){
  const s = DB.settings;
  // TW
  let twCash = s.initTWCash || 0;
  let twBanks = {};
  s.twBanks.forEach(b => twBanks[b] = s.initTWBanks[b] || 0);
  let cc = {};
  s.creditCards.forEach(c => cc[c] = s.initCC[c] || 0);

  // AU
  let auCash = s.initAUCash || 0;
  let auBanks = {};
  s.auBanks.forEach(b => auBanks[b] = s.initAUBanks[b] || 0);

  DB.transactions.forEach(tx => {
    const a = Number(tx.amount) || 0;
    const curr = tx.currency || 'TWD';
    const banks = curr === 'TWD' ? twBanks : auBanks;
    const isAU = curr === 'AUD';

    // 判斷現金（台幣現金 或 澳幣現金）
    const isTWCash = tx.payMethod === '現金';
    const isAUCash = tx.payMethod === '現金（AUD）';
    const isCash = isTWCash || isAUCash;

    const addCash = (v) => { if(isAUCash) auCash+=v; else twCash+=v; };
    const subCash = (v) => { if(isAUCash) auCash-=v; else twCash-=v; };

    if(tx.cat === '收入'){
      if(isCash) addCash(a);
      else if(banks[tx.payMethod] !== undefined) banks[tx.payMethod] += a;
    } else if(tx.cat === '內部轉帳'){
      const intA = Number(tx.intAmt) || 0;
      const fromIsAUCash = tx.intFrom === '現金（AUD）';
      const fromIsTWCash = tx.intFrom === '現金';
      const toIsAUCash = tx.intTo === '現金（AUD）';
      const toIsTWCash = tx.intTo === '現金';
      if(fromIsAUCash) auCash-=intA;
      else if(fromIsTWCash) twCash-=intA;
      else if(twBanks[tx.intFrom] !== undefined) twBanks[tx.intFrom]-=intA;
      else if(auBanks[tx.intFrom] !== undefined) auBanks[tx.intFrom]-=intA;
      if(toIsAUCash) auCash+=intA;
      else if(toIsTWCash) twCash+=intA;
      else if(twBanks[tx.intTo] !== undefined) twBanks[tx.intTo]+=intA;
      else if(auBanks[tx.intTo] !== undefined) auBanks[tx.intTo]+=intA;
    } else if(tx.cat === '信用卡費'){
      const ccA = Number(tx.ccAmt) || 0;
      if(twBanks[tx.ccFrom] !== undefined) twBanks[tx.ccFrom] -= ccA;
      else if(tx.ccFrom === '現金') twCash -= ccA;
      if(cc[tx.ccCard] !== undefined) cc[tx.ccCard] = Math.max(0, cc[tx.ccCard] - ccA);
    } else if(tx.cat === '代墊回款' || tx.cat === '押金退回'){
      if(isCash) addCash(a);
      else if(twBanks[tx.payMethod] !== undefined) twBanks[tx.payMethod] += a;
      else if(auBanks[tx.payMethod] !== undefined) auBanks[tx.payMethod] += a;
    } else {
      // 一般支出、代墊款、押金、不計統計
      if(isCash) subCash(a);
      else if(s.creditCards.includes(tx.payMethod)) cc[tx.payMethod] = (cc[tx.payMethod]||0) + a;
      else if(twBanks[tx.payMethod] !== undefined) twBanks[tx.payMethod] -= a;
      else if(auBanks[tx.payMethod] !== undefined) auBanks[tx.payMethod] -= a;
    }
  });

  // 押金不影響帳戶（押金付出已在主帳記錄）

  const twTotal = twCash + Object.values(twBanks).reduce((a,b)=>a+b,0);
  const auTotal = auCash + Object.values(auBanks).reduce((a,b)=>a+b,0);
  const ccTotal = Object.values(cc).reduce((a,b)=>a+b,0);
  const twReal = twTotal - ccTotal;

  return { twCash, twBanks, auCash, auBanks, cc, ccTotal, twTotal, auTotal, twReal };
}

// ════════════════════════════════════════
// RENDER ALL
// ════════════════════════════════════════
function renderAll(){
  renderOverview();
  renderLedger();
  renderAdvance();
  renderSettings();
  renderCharts();
  fillLedgerFilters();
}

function fmt(n, curr='TWD'){
  const sym = curr==='AUD' ? 'A$' : '$';
  const abs = Math.abs(n);
  if(curr==='AUD'){
    // 澳幣保留兩位小數
    return sym + abs.toLocaleString('en-AU', {minimumFractionDigits:2, maximumFractionDigits:2});
  }
  return sym + Math.round(abs).toLocaleString();
}

// ════════════════════════════════════════
// OVERVIEW
// ════════════════════════════════════════
function renderOverview(){
  const r = computeAll();
  const s = DB.settings;

  let html = `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
    <h2 style="font-size:18px;font-weight:700;">財務總覽</h2>
  </div>`;

  // TW Summary
  html += `<div class="section-hdr" style="color:var(--accent);">🇹🇼 台幣 TWD</div>`;
  html += `<div class="summary-grid">
    <div class="sum-card tw"><div class="sum-label">存款總額</div><div class="sum-val tw">${fmt(r.twTotal)}</div><div class="sum-currency">含現金</div></div>
    <div class="sum-card tw"><div class="sum-label">現金</div><div class="sum-val tw">${fmt(r.twCash)}</div><div class="sum-currency">TWD</div></div>
    <div class="sum-card red"><div class="sum-label">信用卡未繳</div><div class="sum-val neg">${fmt(r.ccTotal)}</div><div class="sum-currency">待繳</div></div>
    <div class="sum-card green"><div class="sum-label">實際擁有</div><div class="sum-val ${r.twReal>=0?'pos':'neg'}">${fmt(r.twReal)}</div><div class="sum-currency">扣除未繳</div></div>
  </div>`;

  // TW Banks
  html += `<div class="card" style="margin-bottom:12px;">
    <div class="card-title">台幣帳戶餘額</div>
    <table class="tbl"><thead><tr><th>帳戶</th><th style="text-align:right;">餘額</th></tr></thead><tbody>
    <tr><td>現金</td><td style="text-align:right;font-family:var(--mono);color:var(--accent);">${fmt(r.twCash)}</td></tr>
    ${s.twBanks.map(b=>`<tr><td>${b}</td><td style="text-align:right;font-family:var(--mono);color:var(--accent);">${fmt(r.twBanks[b]||0)}</td></tr>`).join('')}
    </tbody></table>
  </div>`;

  // CC
  html += `<div class="card" style="margin-bottom:12px;">
    <div class="card-title">信用卡未繳</div>
    <table class="tbl"><thead><tr><th>信用卡</th><th style="text-align:right;">未繳</th></tr></thead><tbody>
    ${s.creditCards.map(c=>`<tr><td>${c}</td><td style="text-align:right;font-family:var(--mono);color:${(r.cc[c]||0)>0?'var(--red)':'var(--t3)'};">${fmt(r.cc[c]||0)}</td></tr>`).join('')}
    </tbody></table>
  </div>`;

  // AU Summary
  html += `<div class="section-hdr" style="color:var(--blue);">🇦🇺 澳幣 AUD</div>`;
  html += `<div class="summary-grid">
    <div class="sum-card au"><div class="sum-label">存款總額</div><div class="sum-val au">${fmt(r.auTotal,'AUD')}</div><div class="sum-currency">含現金</div></div>
    <div class="sum-card au"><div class="sum-label">現金</div><div class="sum-val au">${fmt(r.auCash,'AUD')}</div><div class="sum-currency">AUD</div></div>
  </div>`;

  // AU Banks
  html += `<div class="card" style="margin-bottom:12px;">
    <div class="card-title">澳幣帳戶餘額</div>
    <table class="tbl"><thead><tr><th>帳戶</th><th style="text-align:right;">餘額</th></tr></thead><tbody>
    <tr><td>現金（AUD）</td><td style="text-align:right;font-family:var(--mono);color:var(--blue);">${fmt(r.auCash,'AUD')}</td></tr>
    ${s.auBanks.map(b=>`<tr><td>${b}</td><td style="text-align:right;font-family:var(--mono);color:var(--blue);">${fmt(r.auBanks[b]||0,'AUD')}</td></tr>`).join('')}

  </div>`;

  document.getElementById('ov-content').innerHTML = html;
}

// ════════════════════════════════════════
// LEDGER
// ════════════════════════════════════════
function fillLedgerFilters(){
  const s = DB.settings;
  const months = new Set(DB.transactions.map(t=>t.date?.slice(0,7)).filter(Boolean));
  const mSel = document.getElementById('lf-month');
  const cur = mSel.value;
  mSel.innerHTML = '<option value="">全部月份</option>' + [...months].sort().reverse().map(m=>`<option ${m===cur?'selected':''}>${m}</option>`).join('');

  const cats = ['全部類別',...s.categories,'收入','薪資','業績/獎金','退款','代墊回收','其他收入','代墊款','代墊回款','內部轉帳','信用卡費','不計統計','押金','押金退回'];
  document.getElementById('lf-cat').innerHTML = cats.map((c,i)=>`<option value="${i===0?'':c}">${c}</option>`).join('');

  const allAccts = [...s.twBanks,...s.auBanks,...s.creditCards,'現金（TWD）','現金（AUD）'];
  document.getElementById('lf-acct').innerHTML = '<option value="">全部帳戶</option>' + allAccts.map(a=>`<option>${a}</option>`).join('');
}

function renderLedger(){
  const month = document.getElementById('lf-month').value;
  const cat = document.getElementById('lf-cat').value;
  const acct = document.getElementById('lf-acct').value;
  const curr = document.getElementById('lf-curr').value;

  let txs = [...DB.transactions].sort((a,b)=>{
    const d = (b.date||'').localeCompare(a.date||'');
    if(d!==0) return d;
    return (b.ts||0)-(a.ts||0); // 同一天：後新增的排上面
  });
  if(month) txs = txs.filter(t=>t.date?.startsWith(month));
  if(cat) txs = txs.filter(t=>t.cat===cat || (t.cat==='收入' && t.incomeCat===cat));
  if(acct){
    txs = txs.filter(t=>{
      const a = acct.replace('（TWD）','').replace('（AUD）','');
      return t.payMethod===a || t.ccFrom===a || t.intFrom===a || t.intTo===a || t.ccCard===a;
    });
  }
  if(curr) txs = txs.filter(t=>(t.currency||'TWD')===curr);

  if(!txs.length){ document.getElementById('tx-list').innerHTML='<div class="empty">沒有符合的記錄</div>'; return; }

  const NON_EXPENSE = ['收入','代墊回款','內部轉帳','信用卡費','押金退回'];
  const NON_DEDUCT = ['代墊款','押金'];

  document.getElementById('tx-list').innerHTML = txs.map((tx,i) => {
    const ri = DB.transactions.indexOf(tx);
    const curr = tx.currency || 'TWD';
    const currLabel = curr === 'AUD' ? 'AUD' : 'TWD';
    let amtStr, payStr = tx.payMethod||'';

    if(tx.cat==='收入') amtStr=`<span class="tx-amt in">+${fmt(tx.amount,curr)}</span>`;
    else if(tx.cat==='代墊回款'||tx.cat==='押金退回') amtStr=`<span class="tx-amt in">+${fmt(tx.amount,curr)}</span>`;
    else if(tx.cat==='內部轉帳') { amtStr=`<span class="tx-amt neutral">⇄ ${fmt(tx.intAmt,curr)}</span>`; payStr=`${tx.intFrom}→${tx.intTo}`; }
    else if(tx.cat==='信用卡費') { amtStr=`<span class="tx-amt out">-${fmt(tx.ccAmt,curr)}</span>`; payStr=`${tx.ccFrom}→${tx.ccCard}`; }
    else amtStr=`<span class="tx-amt out">-${fmt(tx.amount,curr)}</span>`;

    const catClass = 'b-' + (tx.cat||'').replace(/\s/g,'');
    const displayLabel = tx.cat==='收入' && tx.incomeCat ? tx.incomeCat : (tx.cat||'');
    const displayDesc = tx.cat==='收入' ? (tx.item||tx.incomeCat||'') : (tx.item||'');
    return `<div class="tx-row">
      <div class="tx-date">${tx.date||''}</div>
      <div><span class="tx-badge ${catClass}">${displayLabel}</span></div>

let _chartCurr = 'TWD';
let _chartRange = 'recent6'; // 'recent6' | 'fullyear'
let _chartTab = 'trend';     // 'trend' | 'pie'

function setChartCurr(c){
  _chartCurr = c;
  document.getElementById('ct-twd').className = 'curr-tab' + (c==='TWD'?' active-tw':'');
  document.getElementById('ct-aud').className = 'curr-tab' + (c==='AUD'?' active-au':'');
  renderCharts();
}

function setChartTab(t){
  _chartTab = t;
  document.getElementById('cht-pane-trend').style.display = t==='trend'?'block':'none';
  document.getElementById('cht-pane-pie').style.display   = t==='pie'?'block':'none';
  const trendBtn = document.getElementById('cht-tab-trend');
  const pieBtn   = document.getElementById('cht-tab-pie');
  trendBtn.style.borderBottomColor = t==='trend'?'var(--accent)':'transparent';
  trendBtn.style.color = t==='trend'?'var(--text)':'var(--t3)';
  pieBtn.style.borderBottomColor = t==='pie'?'var(--accent)':'transparent';
  pieBtn.style.color = t==='pie'?'var(--text)':'var(--t3)';
  if(t==='pie') renderPieCharts();
}

function toggleChartRange(){
  _chartRange = _chartRange==='recent6'?'fullyear':'recent6';
  document.getElementById('cht-range-btn').textContent = _chartRange==='recent6'?'近6月':'全年';
  renderTrendCharts();
}

function renderCharts(){
  renderTrendCharts();
  if(_chartTab==='pie') renderPieCharts();
}

function renderTrendCharts(){
  const curr = _chartCurr;
  const sym = curr==='AUD'?'A$':'$';
  const now = new Date();
  const REAL_EXP = new Set(DB.settings.categories);

  let labels, monthKeys;
  if(_chartRange==='recent6'){
    // 近6個月（含本月）
    monthKeys = [];
    for(let i=5;i>=0;i--){
      const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
      monthKeys.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`);
    }
    labels = monthKeys.map(k=>{ const [y,m]=k.split('-'); return `${m}月`; });
  } else {
    // 全年
    const year = now.getFullYear();
    monthKeys = [];
    for(let m=1;m<=12;m++) monthKeys.push(`${year}-${String(m).padStart(2,'0')}`);
    labels = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
  }

  const txs = DB.transactions.filter(t=>(t.currency||'TWD')===curr);
  const monthly = {};
  monthKeys.forEach(k=>{ monthly[k]={income:0,expense:0}; });
  txs.forEach(tx=>{
    const k=tx.date?.slice(0,7); if(!monthly[k]) return;
    if(tx.cat==='收入') monthly[k].income+=Number(tx.amount||0);
    else if(REAL_EXP.has(tx.cat)) monthly[k].expense+=Number(tx.amount||0);
  });

  const incomes  = monthKeys.map(k=>monthly[k].income);
  const expenses = monthKeys.map(k=>monthly[k].expense);
  const nets     = incomes.map((inc,i)=>inc-expenses[i]);

  // ── 摘要卡
  const totalInc = incomes.reduce((a,b)=>a+b,0);
  const totalExp = expenses.reduce((a,b)=>a+b,0);
  const totalNet = totalInc - totalExp;
  const rangeLabel = _chartRange==='recent6'?'近6月累計':'本年累計';
  document.getElementById('chart-summary-row').innerHTML = `
    <div class="sum-card green" style="margin:0;">
      <div class="sum-label">${rangeLabel}收入</div>
      <div class="sum-val pos" style="font-size:15px;">${fmt(totalInc,curr)}</div>
    </div>
    <div class="sum-card red" style="margin:0;">
      <div class="sum-label">${rangeLabel}支出</div>
      <div class="sum-val neg" style="font-size:15px;">${fmt(totalExp,curr)}</div>
    </div>
    <div class="sum-card ${totalNet>=0?'green':'red'}" style="margin:0;">
      <div class="sum-label">淨額</div>
      <div class="sum-val ${totalNet>=0?'pos':'neg'}" style="font-size:15px;">${totalNet<0?'-':''}${fmt(Math.abs(totalNet),curr)}</div>
    </div>`;

  // ── 月收支長條圖
  if(_charts.monthly) _charts.monthly.destroy();
  _charts.monthly = new Chart(document.getElementById('chart-monthly'),{
    type:'bar',
    data:{labels,datasets:[
      {label:'收入',data:incomes,backgroundColor:'rgba(78,203,141,.75)',borderRadius:4},
      {label:'支出',data:expenses,backgroundColor:'rgba(232,90,122,.75)',borderRadius:4}
    ]},
    options:{responsive:true,
      plugins:{legend:{labels:{color:'#a0a0c0',font:{size:11}}}},
      scales:{
        x:{ticks:{color:'#606080',font:{size:10}}},
        y:{ticks:{color:'#606080',font:{size:10},callback:v=>sym+(curr==='AUD'?v.toFixed(0):Math.round(v).toLocaleString())},
           grid:{color:'rgba(255,255,255,.04)'}}
      }}
  });

  // ── 月淨額折線圖
  if(_charts.net) _charts.net.destroy();
  _charts.net = new Chart(document.getElementById('chart-net'),{
    type:'line',
    data:{labels,datasets:[{
      label:'月淨額',data:nets,
      borderColor:'#7c6af7',backgroundColor:'rgba(124,106,247,.15)',
      pointBackgroundColor: nets.map(n=>n>=0?'#4ecb8d':'#e85a7a'),
      pointRadius:4,fill:true,tension:.35
    }]},
    options:{responsive:true,plugins:{legend:{display:false}},
      scales:{
        x:{ticks:{color:'#606080',font:{size:10}}},
        y:{ticks:{color:'#606080',font:{size:10},callback:v=>sym+(curr==='AUD'?v.toFixed(0):Math.round(v).toLocaleString())},
           grid:{color:'rgba(255,255,255,.05)'},border:{dash:[4,4]}}
      }}
  });
}

function renderPieCharts(){
  const curr = _chartCurr;
  const REAL_EXP = new Set(DB.settings.categories);
  const colors=['#7c6af7','#4ecb8d','#5ab4f7','#f7c86a','#e85a7a','#f7a05a','#a0a0c0','#e8845a','#c084fc'];

  // 填月份選擇器
  const monthSel = document.getElementById('cf-pie-month');
  const months = new Set(DB.transactions.filter(t=>(t.currency||'TWD')===curr).map(t=>t.date?.slice(0,7)).filter(Boolean));
  const nowKey = `${new Date().getFullYear()}-${String(new Date().getMonth()+1).padStart(2,'0')}`;
  if(!months.has(nowKey)) months.add(nowKey);
  const sortedMonths = [...months].sort().reverse();
  if(!monthSel.innerHTML || monthSel.dataset.curr!==curr){
    monthSel.innerHTML = sortedMonths.map(m=>`<option value="${m}">${m}</option>`).join('');
    monthSel.dataset.curr = curr;
    // 預設當月
    if(sortedMonths.includes(nowKey)) monthSel.value = nowKey;
  }
  const selMonth = monthSel.value;

  const txs = DB.transactions.filter(t=>(t.currency||'TWD')===curr && t.date?.startsWith(selMonth));

  // 支出圓餅
  const expData={};
  txs.filter(t=>REAL_EXP.has(t.cat)).forEach(t=>{ expData[t.cat]=(expData[t.cat]||0)+Number(t.amount||0); });
  const expLabels=Object.keys(expData), expVals=Object.values(expData);

  if(_charts.catExp) _charts.catExp.destroy();
  document.getElementById('chart-cat-exp').style.display = expLabels.length?'block':'none';
  document.getElementById('chart-cat-exp-empty').style.display = expLabels.length?'none':'block';
  if(expLabels.length){
    _charts.catExp = new Chart(document.getElementById('chart-cat-exp'),{
      type:'doughnut',
      data:{labels:expLabels,datasets:[{data:expVals,backgroundColor:colors,borderWidth:0}]},
      options:{responsive:true,plugins:{legend:{position:'bottom',labels:{color:'#a0a0c0',font:{size:10},padding:8}}}}
    });
  }

  // 收入圓餅（按 incomeCat 細分）
  const incData={};
  txs.filter(t=>t.cat==='收入').forEach(t=>{
    const k = t.incomeCat||'收入';
    incData[k]=(incData[k]||0)+Number(t.amount||0);
  });
  const incLabels=Object.keys(incData), incVals=Object.values(incData);

  if(_charts.catInc) _charts.catInc.destroy();
  document.getElementById('chart-cat-inc').style.display = incLabels.length?'block':'none';
  document.getElementById('chart-cat-inc-empty').style.display = incLabels.length?'none':'block';
  if(incLabels.length){
    _charts.catInc = new Chart(document.getElementById('chart-cat-inc'),{
      type:'doughnut',
      data:{labels:incLabels,datasets:[{data:incVals,backgroundColor:colors.slice().reverse(),borderWidth:0}]},
      options:{responsive:true,plugins:{legend:{position:'bottom',labels:{color:'#a0a0c0',font:{size:10},padding:8}}}}
    });
  }
}

function openTxModal(){
  const today = new Date().toISOString().slice(0,10);
  document.getElementById('tx-date').value = today;
  document.getElementById('tx-curr').value = 'TWD';
  document.getElementById('tx-amt').value = '';
  document.getElementById('tx-item').value = '';
  document.getElementById('tx-note').value = '';
  document.getElementById('tx-stat').checked = true;
  document.getElementById('tx-adv-check').checked = false;
  document.getElementById('tx-adv-detail').style.display = 'none';
  document.getElementById('tx-adv-rows').innerHTML = '';
  document.getElementById('tx-income-amt').value = '';
  document.getElementById('tx-income-item').value = '';
  document.getElementById('tx-income-cat').value = '薪資';

  onTxCurrChange();
  onTxStatChange();
  document.getElementById('modal-tx').classList.add('open');
}

function onTxCurrChange(){
  const curr = document.getElementById('tx-curr').value;
  const s = DB.settings;
  const banks = curr==='AUD' ? s.auBanks : s.twBanks;
  const cash = curr==='AUD' ? '現金（AUD）' : '現金';
  const allPay = [...(curr==='TWD'?s.creditCards:[]), ...banks, cash];

  document.getElementById('tx-pay').innerHTML =
    allPay.map(p=>`<option value="${p}">${p}</option>`).join('') +
    `<optgroup label="───────────">
      <option value="__income__">💰 收入</option>
      <option value="__internal__">⇄ 內部轉帳</option>
      ${curr==='TWD'?'<option value="__ccfee__">💳 繳信用卡費</option>':''}
    </optgroup>`;

  // Income acc
  document.getElementById('tx-income-acc').innerHTML = [...banks, cash].map(p=>`<option>${p}</option>`).join('');

  // CC
  document.getElementById('tx-cc-card').innerHTML = s.creditCards.map(c=>`<option>${c}</option>`).join('');
  document.getElementById('tx-cc-from').innerHTML = [...s.twBanks,'現金'].map(p=>`<option>${p}</option>`).join('');

  // Internal
  const allAccts = [...s.twBanks,...s.auBanks,'現金','現金（AUD）'];
  document.getElementById('tx-int-from').innerHTML = allAccts.map(p=>`<option>${p}</option>`).join('');
  document.getElementById('tx-int-to').innerHTML = allAccts.map(p=>`<option>${p}</option>`).join('');

  // Cat
  document.getElementById('tx-cat').innerHTML = s.categories.map(c=>`<option>${c}</option>`).join('');

  onTxPayChange();
}

function onTxPayChange(){
  const pay = document.getElementById('tx-pay').value;
  const isIncome = pay==='__income__';
  const isInternal = pay==='__internal__';
  const isCCFee = pay==='__ccfee__';
  const isNormal = !isIncome && !isInternal && !isCCFee;

  document.getElementById('tx-income-area').style.display = isIncome?'block':'none';
  document.getElementById('tx-int-area').style.display = isInternal?'block':'none';
  document.getElementById('tx-cc-area').style.display = isCCFee?'block':'none';
  document.getElementById('tx-amt-grp').style.display = isNormal?'block':'none';
  document.getElementById('tx-stat-grp').style.display = isNormal?'block':'none';
  document.getElementById('tx-cat-grp').style.display = (isNormal&&document.getElementById('tx-stat').checked)?'block':'none';
  document.getElementById('tx-item-grp').style.display = isNormal?'block':'none';
  document.getElementById('tx-adv-addon').style.display = isNormal?'block':'none';
  if(!isNormal){ document.getElementById('tx-adv-check').checked=false; document.getElementById('tx-adv-detail').style.display='none'; }
}

function onTxStatChange(){
  const checked = document.getElementById('tx-stat').checked;
  document.getElementById('tx-cat-grp').style.display = checked?'block':'none';
}

function onTxAmtChange(){
  updateAlloc();
}

function updateAlloc(){
  const total = Number(document.getElementById('tx-amt').value)||0;
  const curr = document.getElementById('tx-curr').value;
  if(!document.getElementById('tx-adv-check').checked) return;
  let advTotal = 0;
  [...document.getElementById('tx-adv-rows').children].forEach(row=>{
    advTotal += Number(row.querySelector('input[type=number]')?.value)||0;
  });
  const mine = Math.max(0, total - advTotal);
  document.getElementById('tx-adv-total').textContent = fmt(advTotal, curr);
  document.getElementById('tx-mine-display').textContent = fmt(mine, curr);
  // 顏色提示：超額紅、正好綠、未分配黃
  const mineEl = document.getElementById('tx-mine-display');
  mineEl.style.color = advTotal > total ? 'var(--red)' : mine===0&&total>0 ? 'var(--t3)' : 'var(--green)';
}

function onTxAdvCheck(){
  const checked = document.getElementById('tx-adv-check').checked;
  document.getElementById('tx-adv-detail').style.display = checked?'block':'none';
  if(checked && document.getElementById('tx-adv-rows').children.length===0) addAdvRow();
  updateAlloc();
}

function addAdvRow(){
  const div = document.createElement('div');
  div.className = 'adv-row';
  div.style = 'display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-bottom:6px;align-items:center;';
  div.innerHTML = `
    <input type="text" placeholder="對象姓名" style="background:var(--s2);border:1px solid var(--border);color:var(--text);padding:7px 9px;border-radius:var(--r-xs);font-family:var(--font);font-size:12px;">
    <input type="number" placeholder="金額" min="0" oninput="updateAlloc()" style="background:var(--s2);border:1px solid var(--border);color:var(--yellow);padding:7px 9px;border-radius:var(--r-xs);font-family:var(--font);font-size:12px;">
    <button type="button" onclick="this.closest('.adv-row').remove();updateAlloc()" style="background:none;border:none;color:var(--t3);cursor:pointer;font-size:18px;">×</button>`;
  document.getElementById('tx-adv-rows').appendChild(div);
}

function saveTx(){
  const date = document.getElementById('tx-date').value;
  const curr = document.getElementById('tx-curr').value;
  const pay = document.getElementById('tx-pay').value;
  const note = document.getElementById('tx-note').value;
  if(!date){ alert('請填日期'); return; }

  if(pay==='__internal__'){
    const amt = Number(document.getElementById('tx-int-amt').value)||0;
    if(!amt){ alert('請填金額'); return; }
    DB.transactions.push({cat:'內部轉帳',date,ts:Date.now(),currency:curr,note,amount:amt,intAmt:amt,
      intFrom:document.getElementById('tx-int-from').value,
      intTo:document.getElementById('tx-int-to').value});
    save(); closeModal('modal-tx'); renderAll(); return;
  }
  if(pay==='__ccfee__'){
    const amt = Number(document.getElementById('tx-cc-amt').value)||0;
    if(!amt){ alert('請填金額'); return; }
    DB.transactions.push({cat:'信用卡費',date,ts:Date.now(),currency:'TWD',note,amount:amt,ccAmt:amt,
      ccCard:document.getElementById('tx-cc-card').value,
      ccFrom:document.getElementById('tx-cc-from').value});
    save(); closeModal('modal-tx'); renderAll(); return;
  }
  if(pay==='__income__'){
    const amt = Number(document.getElementById('tx-income-amt').value)||0;
    if(!amt){ alert('請填金額'); return; }
    const incCat = document.getElementById('tx-income-cat').value;
    const incItem = document.getElementById('tx-income-item').value;
    DB.transactions.push({cat:'收入',incomeCat:incCat,date,ts:Date.now(),currency:curr,item:incItem,note,amount:amt,
      payMethod:document.getElementById('tx-income-acc').value});
    save(); closeModal('modal-tx'); renderAll(); return;
  }

  const total = Number(document.getElementById('tx-amt').value)||0;
  const stat = document.getElementById('tx-stat').checked;
  const cat = stat?document.getElementById('tx-cat').value:'不計統計';
  const item = document.getElementById('tx-item').value;
  if(!total){ alert('請填金額'); return; }

  // 代墊
  let advRows = [];
  if(document.getElementById('tx-adv-check').checked){
    [...document.getElementById('tx-adv-rows').children].forEach(row=>{
      const who = row.querySelector('input[type=text]')?.value;
      const amt = Number(row.querySelector('input[type=number]')?.value)||0;
      if(who&&amt) advRows.push({who,amt});
    });
  }

  // mine = total - 代墊合計（預設 100%）
  const advSum = advRows.reduce((s,a)=>s+a.amt,0);
  if(advSum > total){ alert(`代墊合計 ${fmt(advSum,curr)} 超過總金額 ${fmt(total,curr)}`); return; }
  const mine = total - advSum;

  const _ts = Date.now();

  // 主帳（我的份額）
  if(mine>0){
    DB.transactions.push({cat,date,ts:_ts,currency:curr,item,note,amount:mine,payMethod:pay});
  }

  // 代墊
  advRows.forEach((a,i)=>{
    DB.transactions.push({cat:'代墊款',date,ts:_ts+1+i,currency:curr,item:`代墊-${a.who}`,note,amount:a.amt,payMethod:pay});
    DB.advances.push({id:Date.now()+Math.random(),date,who:a.who,amount:a.amt,currency:curr,desc:item||note,settled:false});
  });

  save(); closeModal('modal-tx'); renderAll();
}

// ════════════════════════════════════════
// DELETE
// ════════════════════════════════════════
function delTx(idx){
  if(!confirm('確定刪除？')) return;
  const tx = DB.transactions[idx];
  if(tx?.cat==='代墊款'){
    const whoName = tx.item?.replace('代墊-','');
    const ai = DB.advances.findIndex(a=>a.date===tx.date&&a.who===whoName&&!a.settled);
    if(ai!==-1) DB.advances.splice(ai,1);
  }
  DB.transactions.splice(idx,1);
  save(); renderAll();
}

function delAdv(id){
  if(!confirm('確定刪除？')) return;
  const ai = DB.advances.findIndex(a=>a.id==id);
  if(ai!==-1){
    const adv = DB.advances[ai];
    const ti = DB.transactions.findIndex(t=>t.cat==='代墊款'&&t.date===adv.date&&t.item===`代墊-${adv.who}`);
    if(ti!==-1) DB.transactions.splice(ti,1);
    DB.advances.splice(ai,1);
  }
  save(); renderAll();
}

// ════════════════════════════════════════
// REPAY
// ════════════════════════════════════════
function openRepayModal(id){
  _repayId = id;
  const adv = DB.advances.find(a=>a.id==id);
  document.getElementById('repay-title').textContent = `登記回款 — ${adv?.who} ${fmt(adv?.amount, adv?.currency||'TWD')}`;
  document.getElementById('repay-date').value = new Date().toISOString().slice(0,10);
  document.getElementById('repay-method').value = '現金';
  const banks = (adv?.currency==='AUD'?DB.settings.auBanks:DB.settings.twBanks);
  const cash = adv?.currency==='AUD'?'現金（AUD）':'現金';
  document.getElementById('repay-bank').innerHTML = [...banks,cash].map(b=>`<option>${b}</option>`).join('');
  onRepayMethodChange();
  document.getElementById('modal-repay').classList.add('open');
}

function onRepayMethodChange(){
  const m = document.getElementById('repay-method').value;
  document.getElementById('repay-bank-grp').style.display = m==='銀行轉帳'?'block':'none';
}

function saveRepay(){
  const adv = DB.advances.find(a=>a.id==_repayId);
  if(!adv) return;
  const date = document.getElementById('repay-date').value;
  const method = document.getElementById('repay-method').value;
  const bank = method==='銀行轉帳'?document.getElementById('repay-bank').value:(adv.currency==='AUD'?'現金（AUD）':'現金');
  const payMethod = bank.replace('（AUD）','').replace('（TWD）','');

  DB.transactions.push({cat:'代墊回款',date,ts:Date.now(),currency:adv.currency||'TWD',
    item:`代墊回款—${adv.who}`,note:adv.desc,amount:adv.amount,payMethod});
  adv.settled = true;
  adv.settleDate = date;
  adv.settleMethod = method;

  save(); closeModal('modal-repay'); renderAll();
}

// ════════════════════════════════════════
// DEPOSIT
// ════════════════════════════════════════
function openDepositModal(){
  document.getElementById('dep-date').value = new Date().toISOString().slice(0,10);
  document.getElementById('dep-curr').value = 'AUD';
  document.getElementById('dep-amt').value = '';
  document.getElementById('dep-desc').value = '';
  document.getElementById('dep-note').value = '';
  const allPay = [...DB.settings.auBanks,'現金（AUD）',...DB.settings.twBanks,'現金'];
  document.getElementById('dep-pay').innerHTML = allPay.map(p=>`<option>${p}</option>`).join('');
  document.getElementById('modal-deposit').classList.add('open');
}

function saveDeposit(){
  const date = document.getElementById('dep-date').value;
  const curr = document.getElementById('dep-curr').value;
  const amt = Number(document.getElementById('dep-amt').value)||0;
  const pay = document.getElementById('dep-pay').value;
  const desc = document.getElementById('dep-desc').value;
  const note = document.getElementById('dep-note').value;
  if(!date||!amt){ alert('請填日期和金額'); return; }

  const id = Date.now()+Math.random();
  // 押金付出記在主帳
  DB.transactions.push({cat:'押金',date,ts:Date.now(),currency:curr,item:desc||'押金',note,amount:amt,payMethod:pay.replace('（AUD）','').replace('（TWD）','')});
  if(!DB.deposits) DB.deposits=[];
  DB.deposits.push({id,date,currency:curr,amount:amt,payMethod:pay,desc,note,returned:false});

  save(); closeModal('modal-deposit'); renderAll();
}

function openDepositRepayModal(id){
  _depositRepayId = id;
  const dep = DB.deposits.find(d=>d.id==id);
  document.getElementById('dr-date').value = new Date().toISOString().slice(0,10);
  document.getElementById('dr-method').value = '現金';
  const banks = (dep?.currency==='AUD'?DB.settings.auBanks:DB.settings.twBanks);
  document.getElementById('dr-bank').innerHTML = [...banks].map(b=>`<option>${b}</option>`).join('');
  onDRMethodChange();
  document.getElementById('modal-deposit-repay').classList.add('open');
}

function onDRMethodChange(){
  document.getElementById('dr-bank-grp').style.display = document.getElementById('dr-method').value==='銀行轉帳'?'block':'none';
}

function saveDepositRepay(){
  const dep = DB.deposits.find(d=>d.id==_depositRepayId);
  if(!dep) return;
  const date = document.getElementById('dr-date').value;
  const method = document.getElementById('dr-method').value;
  const bank = method==='銀行轉帳'?document.getElementById('dr-bank').value:(dep.currency==='AUD'?'現金（AUD）':'現金');

  DB.transactions.push({cat:'押金退回',date,ts:Date.now(),currency:dep.currency||'TWD',
    item:`押金退回—${dep.desc||''}`,note:'',amount:dep.amount,
    payMethod:bank.replace('（AUD）','').replace('（TWD）','')});
  dep.returned = true;
  dep.returnDate = date;

  save(); closeModal('modal-deposit-repay'); renderAll();
}

function delDeposit(id){
  if(!confirm('確定刪除押金記錄？')) return;
  const di = DB.deposits.findIndex(d=>d.id==id);
  if(di!==-1){
    const dep = DB.deposits[di];
    const ti = DB.transactions.findIndex(t=>t.cat==='押金'&&t.date===dep.date);
    if(ti!==-1) DB.transactions.splice(ti,1);
    DB.deposits.splice(di,1);
  }
  save(); renderAll();
}

// ════════════════════════════════════════
// NAV
// ════════════════════════════════════════
function showPage(name){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('page-'+name).classList.add('active');
  document.querySelector(`[onclick="showPage('${name}')"]`).classList.add('active');
  if(name==='charts') renderCharts();
}

function closeModal(id){
  document.getElementById(id).classList.remove('open');
}

loadFromCloud();
