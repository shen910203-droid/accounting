<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="測試A">
<meta name="theme-color" content="#0b0b12">
<title>測試A</title>
<!-- 狀態列模糊測試頁：每 10pt 一排細條紋，被系統模糊蓋到的條紋會糊成灰色。沒有任何資料。 -->
<style>
html,body{margin:0;background:#0b0b12;color:#eeedf7;font:600 13px -apple-system,"PingFang TC",sans-serif;-webkit-text-size-adjust:100%}
.row{position:absolute;left:0;right:0;height:10px;display:flex;align-items:center;padding-left:6px;box-sizing:border-box}
.lab{width:40px;flex:none;color:#ffd400;font-size:9px;line-height:10px}
.stripe{flex:1;height:7px;background:repeating-linear-gradient(90deg,#fff 0 1px,#0b0b12 1px 3px)}
.box{position:absolute;top:230px;left:14px;right:14px;background:#15141f;border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:14px;line-height:1.6}
.box b{color:#a493ff}
#st{position:absolute;top:0;height:env(safe-area-inset-top);width:1px}
</style>
</head>
<body>
<div id="st"></div>
<div id="rows"></div>
<div class="box">
  <div style="font-size:17px;font-weight:800;margin-bottom:6px" id="name">測試A</div>
  <div>狀態列設定：<b id="mode"></b></div>
  <div>桌面 App 模式：<b id="sa"></b>　頂端安全區：<b id="inset"></b></div>
  <div>螢幕：<b id="scr"></b></div>
  <div style="margin-top:10px;color:#9a97b0">
    1. 確認上面「桌面 App 模式」是 <b>是</b>（不是的話，請從 Safari「分享 → 加入主畫面」再從主畫面打開）<br>
    2. <b>不要捲動</b>，直接截圖給 Claude<br>
    3. 黃色數字是距離網頁頂端幾 pt；條紋糊掉的地方就是被系統模糊蓋到的範圍
  </div>
</div>
<script>
var rows = '';
for (var y = 0; y <= 220; y += 10) rows += '<div class="row" style="top:' + y + 'px"><span class="lab">' + y + 'pt</span><span class="stripe"></span></div>';
document.getElementById('rows').innerHTML = rows;
var m = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]').content;
document.getElementById('mode').textContent = m === 'black' ? '實心黑色（black）' : '透明（black-translucent）';
document.getElementById('sa').textContent = (navigator.standalone || matchMedia('(display-mode: standalone)').matches) ? '是' : '否（請從主畫面打開）';
document.getElementById('inset').textContent = Math.round(document.getElementById('st').getBoundingClientRect().height) + 'pt';
document.getElementById('scr').textContent = screen.width + '×' + screen.height + 'pt，網頁可用高度 ' + innerHeight + 'pt';
</script>
</body>
</html>
